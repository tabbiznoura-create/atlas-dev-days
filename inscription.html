
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Dev Days</title>
    <link rel="stylesheet" href="css/style.css">
</head>   

<body>

<header>
    <p>Atlas Dev Days</p>


<nav>
   
        <a href="index.html" class="button">Accueil</a>
        <a href="programme.html" class="button">Programme</a>
        <a href="intervenants.html" class="button">Intervenants</a>
        <a href="inscription.html" class="button">Inscription</a>
    </nav>
</header>

<main>
    <h1>Réservez votre place pour une journée dédiée au développement Web.</h1>

    <form>

<article>
    <label for="nom">Nom complet</label> <br>

        <input type="text" id="nom" class="input2" name="nomComplet" required minlength="3">
</article> <br>

<article>
    <label for="email">Email</label> <br>
        <input type="email" class="input2" id="email" name="email" required>
</article> <br>

<article>
    <label for="tel">Téléphone</label> <br>
        <input type="tel" id="tel" class="input2" name="telephone" required pattern="(\+212|0)[5-7][0-9]{8}$">
</article> <br>

<article>
    <label for="profil">Profil</label> <br>

    <select id="profil" class="input2" name="profil" required>
        <option value="">Choisir</option>
        <option value="etudiant">Etudiant·e</option>
        <option value="devloppeur">Développeur·se</option>
        <option value="autre">Autre</option>
        
    </select>
</article> <br>

<article>
    
    <label>Ateliers souhaités:</label> <br>
    
    <input type="checkbox" id="atelier1" name="ateliers" value="web">
    <label for="atelier1">Dévelopement web</label> <br>
    
    <input type="checkbox" id="atelier2" name="ateliers" value="JavaScript">
    <label for="atelier2">JavaScript</label> <br>

    <input type="checkbox" id="atelier3" name="ateliers" value="ia">
    <label for="atelier3">Intelligence artificielle</label>

</article> <br>

<article>
<label>Journées(s) de participation:</label> <br>

<input type="radio" id="jour1" name="journee" value="jour1" required>
<label for="jour1">Jour 1</label> <br>

<input type="radio" id="jour2" name="journee" value="jour2">
<label for="jour2">Jour 2</label> <br>

<input type="radio" id="lesDeux" name="journee" value="les-deux">
<label for="lesDeux">les deux</label>

</article> <br>

<article>
    <label for="message">Message</label> <br>
    <textarea id="message" name="message"></textarea>
</article> 

<article>
    <input type="checkbox" id="accord" name="accord" required>
    <label for="accord">J'accepte les conditions de participation</label>
</article>
<br>
<button type="submit" class="button">S'inscrire</button>
</form>

</main>

<footer>
     <p>Atlas Dev Days</p>
